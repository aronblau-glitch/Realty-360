<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Realty 360 Logo">
  <defs>

    <radialGradient id="bg" cx="40%" cy="35%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#162550"/>
      <stop offset="60%"  stop-color="#0c1a3c"/>
      <stop offset="100%" stop-color="#060f28"/>
    </radialGradient>

    <!-- Arc: deep blue → vivid cyan -->
    <linearGradient id="ringG" gradientUnits="userSpaceOnUse" x1="380" y1="325" x2="200" y2="75">
      <stop offset="0%"   stop-color="#1248c0"/>
      <stop offset="50%"  stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06d6f0"/>
    </linearGradient>

    <!-- House gradient: white top → icy blue bottom -->
    <linearGradient id="houseG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8d8f0"/>
    </linearGradient>

    <!-- Door fill -->
    <linearGradient id="doorG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#06d6f0"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Text "360" cyan -->
    <linearGradient id="cyanTxt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#06d6f0"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Subtle inner vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </radialGradient>

    <!-- Glow on arc -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Drop shadow for card -->
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(0,0,0,0.55)"/>
    </filter>

    <clipPath id="clip">
      <rect width="500" height="500" rx="88" ry="88"/>
    </clipPath>

  </defs>

  <!-- Card shadow -->
  <rect width="500" height="500" rx="88" ry="88" fill="#060f28" filter="url(#cardShadow)" transform="translate(0,6)"/>

  <!-- Background -->
  <rect width="500" height="500" rx="88" ry="88" fill="url(#bg)"/>
  <rect width="500" height="500" rx="88" ry="88" fill="url(#vignette)"/>

  <g clip-path="url(#clip)">

    <!--
      ARC  center(250,218)  radius 163
      Start 38°  → (378.4, 318.2)
      End   322° → (378.4, 117.8)
      Clockwise 284°  large-arc=1
      Gap ~76° at upper-right (12–3 o'clock)
    -->
    <path d="M 378,318 A 163,163 0 1 1 378,118"
          fill="none"
          stroke="url(#ringG)"
          stroke-width="15"
          stroke-linecap="round"
          filter="url(#glow)"/>

    <!-- Tick dots at arc endpoints -->
    <circle cx="378" cy="318" r="5" fill="#06d6f0" opacity="0.9"/>
    <circle cx="378" cy="118" r="5" fill="#06d6f0" opacity="0.9"/>

    <!-- Degree label in the gap -->
    <text x="418" y="225"
          font-family="'Arial','Helvetica',sans-serif"
          font-size="20" font-weight="700"
          fill="#06d6f0" opacity="0.75"
          text-anchor="middle">360°</text>

    <!--
      HOUSE  (blueprint-style: stroke only, no opaque fill)
      Roof apex (250, 140)
      Roof feet (186, 212) and (314, 212)
      Body (198,212)→(302,212)→(302,292)→(198,292)
      Door arch centered at bottom
    -->

    <!-- Roof face (filled, gradient) -->
    <polygon points="250,138 184,214 316,214"
             fill="url(#houseG)" opacity="0.95"/>

    <!-- Body -->
    <rect x="196" y="212" width="108" height="80"
          fill="url(#houseG)" opacity="0.95"/>

    <!-- Door with rounded top -->
    <path d="M 234,292 L 234,258 Q 234,244 250,244 Q 266,244 266,258 L 266,292 Z"
          fill="url(#doorG)"/>

    <!-- Windows (2 small squares, symmetric) -->
    <rect x="206" y="228" width="20" height="18" rx="3"
          fill="none" stroke="url(#ringG)" stroke-width="2.5" opacity="0.8"/>
    <rect x="274" y="228" width="20" height="18" rx="3"
          fill="none" stroke="url(#ringG)" stroke-width="2.5" opacity="0.8"/>

    <!-- Roof ridge line for depth -->
    <line x1="250" y1="138" x2="250" y2="214"
          stroke="rgba(14,165,233,0.3)" stroke-width="1.5"/>

    <!--
      TEXT
      "REALTY" white  "360" cyan
    -->
    <text x="250" y="384"
          font-family="'Arial Black','Arial',sans-serif"
          font-size="52" font-weight="900"
          text-anchor="middle" letter-spacing="3">
      <tspan fill="white">REALTY </tspan><tspan fill="url(#cyanTxt)">360</tspan>
    </text>

  </g>
</svg>
