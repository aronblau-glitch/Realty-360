<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Realty 360 Logo">
  <defs>

    <!-- ── Background: deep navy radial gradient ── -->
    <radialGradient id="bg" cx="40%" cy="32%" r="72%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1d3878"/>
      <stop offset="55%"  stop-color="#112060"/>
      <stop offset="100%" stop-color="#091535"/>
    </radialGradient>

    <!-- ── Rounded-square clip (same shape as background) ── -->
    <clipPath id="appClip">
      <rect width="500" height="500" rx="78" ry="78"/>
    </clipPath>

    <!-- ── Circle arc gradient: deep blue at bottom → bright cyan at top ── -->
    <linearGradient id="arcG" gradientUnits="userSpaceOnUse"
                    x1="378" y1="270" x2="190" y2="60">
      <stop offset="0%"   stop-color="#1255cc"/>
      <stop offset="45%"  stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#38d8ff"/>
    </linearGradient>

    <!-- ── Blue buildings gradient (left-edge darker → right-edge lighter) ── -->
    <linearGradient id="blueB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0e4ecf"/>
      <stop offset="100%" stop-color="#2d90e0"/>
    </linearGradient>

    <!-- ── Tall center building (white hero): left face bright, right face ice-blue) ── -->
    <linearGradient id="tallB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#d5ecf8"/>
      <stop offset="38%"  stop-color="#f4faff"/>
      <stop offset="100%" stop-color="#a5ccec"/>
    </linearGradient>

    <!-- ── Chevron gradient: bright white at peak → steel blue at tips ── -->
    <linearGradient id="chevG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#edf6ff"/>
      <stop offset="100%" stop-color="#5496c0"/>
    </linearGradient>

    <!-- ── Right grid building: pale blue → grey-blue ── -->
    <linearGradient id="gridB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#c8e2f5"/>
      <stop offset="100%" stop-color="#76aac8"/>
    </linearGradient>

    <!-- ── Text gradient: "360" cyan glow ── -->
    <linearGradient id="cyanText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#50e0ff"/>
      <stop offset="100%" stop-color="#20b0e8"/>
    </linearGradient>

    <!-- ── Soft inner shadow on background ── -->
    <radialGradient id="innerShadow" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.35)"/>
    </radialGradient>

  </defs>

  <!-- ══════════════════════════════════════════ -->
  <!-- BACKGROUND                                 -->
  <!-- ══════════════════════════════════════════ -->
  <rect width="500" height="500" rx="78" ry="78" fill="url(#bg)"/>
  <!-- Inner vignette for depth -->
  <rect width="500" height="500" rx="78" ry="78" fill="url(#innerShadow)"/>


  <!-- ══════════════════════════════════════════ -->
  <!-- CIRCLE ARC                                 -->
  <!--                                            -->
  <!--  Center : (250, 198)   Radius : 150        -->
  <!--  Start  : 32°  → (377, 277)               -->
  <!--  End    : 312° → (350,  98)               -->
  <!--  Sweep  : 280° clockwise (large-arc = 1)  -->
  <!--  Gap    : ~80° at upper-right (1–4 o'clk) -->
  <!-- ══════════════════════════════════════════ -->
  <!--
    Angle math (SVG: 0°=right, 90°=down, clockwise positive)
    32°  : x = 250 + 150·cos(32°) = 250 + 127.2 = 377.2
           y = 198 + 150·sin(32°) = 198 +  79.5 = 277.5
    312° : x = 250 + 150·cos(312°)= 250 + 100.3 = 350.3
           y = 198 + 150·sin(312°)= 198 − 111.5 =  86.5
  -->
  <path d="M 377,278
           A 150,150 0 1 1 350,87"
        fill="none"
        stroke="url(#arcG)"
        stroke-width="11"
        stroke-linecap="round"/>


  <!-- ══════════════════════════════════════════ -->
  <!-- BUILDINGS  (drawn beneath chevron)         -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Left flanker — small blue rectangle -->
  <rect x="179" y="226" width="20" height="50" rx="2.5" fill="url(#blueB)"/>

  <!-- Left main blue building -->
  <rect x="202" y="198" width="23" height="78" rx="2.5" fill="url(#blueB)"/>

  <!-- CENTER TALL BUILDING (white hero, parallelogram for 3-D depth) -->
  <!--  Bottom-left (228,276) → top-left (232,118) →            -->
  <!--  top-right  (258,118) → bottom-right(255,276)            -->
  <polygon points="228,276 233,118 258,118 254,276" fill="url(#tallB)"/>
  <!-- Subtle dark-face shadow on the right edge of the tall building -->
  <polygon points="254,276 258,118 261,120 257,276" fill="rgba(10,30,80,0.18)"/>

  <!-- Right main blue building -->
  <rect x="260" y="186" width="22" height="90" rx="2.5" fill="url(#blueB)"/>

  <!-- Right grid building (lighter, multi-story lines) -->
  <rect x="294" y="214" width="34" height="62" rx="2.5" fill="url(#gridB)"/>
  <!-- Horizontal floor lines -->
  <line x1="295" y1="222" x2="327" y2="222" stroke="#0b1d55" stroke-width="1.4" opacity="0.5"/>
  <line x1="295" y1="230" x2="327" y2="230" stroke="#0b1d55" stroke-width="1.4" opacity="0.5"/>
  <line x1="295" y1="238" x2="327" y2="238" stroke="#0b1d55" stroke-width="1.4" opacity="0.5"/>
  <line x1="295" y1="246" x2="327" y2="246" stroke="#0b1d55" stroke-width="1.4" opacity="0.5"/>
  <line x1="295" y1="254" x2="327" y2="254" stroke="#0b1d55" stroke-width="1.4" opacity="0.5"/>
  <line x1="295" y1="262" x2="327" y2="262" stroke="#0b1d55" stroke-width="1.4" opacity="0.5"/>
  <!-- Vertical divider -->
  <line x1="312" y1="214" x2="312" y2="276" stroke="#0b1d55" stroke-width="1.4" opacity="0.5"/>


  <!-- ══════════════════════════════════════════ -->
  <!-- CHEVRON / HOUSE ROOFLINE                   -->
  <!--  Peak : (250, 254)                         -->
  <!--  Arms → (178, 298) and (322, 298)          -->
  <!-- ══════════════════════════════════════════ -->
  <polyline points="178,298 250,254 322,298"
            fill="none"
            stroke="url(#chevG)"
            stroke-width="15"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- 2×2 window/door grid at chevron center -->
  <!-- Centered at ~(250, 269), squares 7×7 px with 2 px gap -->
  <rect x="242"   y="261" width="7" height="7" rx="1.5" fill="#38d8ff"/>
  <rect x="251.5" y="261" width="7" height="7" rx="1.5" fill="#38d8ff"/>
  <rect x="242"   y="270" width="7" height="7" rx="1.5" fill="#38d8ff"/>
  <rect x="251.5" y="270" width="7" height="7" rx="1.5" fill="#38d8ff"/>


  <!-- ══════════════════════════════════════════ -->
  <!-- TEXT                                       -->
  <!-- "REALTY" (white) · "360" (cyan)            -->
  <!-- Single line, same weight, same size        -->
  <!-- ══════════════════════════════════════════ -->
  <text x="250" y="382"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="44"
        font-weight="900"
        text-anchor="middle"
        letter-spacing="5">
    <tspan fill="white">REALTY</tspan><tspan fill="url(#cyanText)"> 360</tspan>
  </text>

</svg>
