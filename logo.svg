<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Realty 360 Logo">
  <defs>

    <!-- Background: deep navy -->
    <radialGradient id="bg" cx="38%" cy="30%" r="75%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1a3a7a"/>
      <stop offset="50%"  stop-color="#0f2260"/>
      <stop offset="100%" stop-color="#071440"/>
    </radialGradient>

    <!-- Gloss overlay -->
    <radialGradient id="gloss" cx="50%" cy="0%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Arc gradient: deep blue at bottom → vivid cyan at top -->
    <linearGradient id="arcG" gradientUnits="userSpaceOnUse" x1="370" y1="310" x2="160" y2="70">
      <stop offset="0%"   stop-color="#1050c8"/>
      <stop offset="40%"  stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#20c8f0"/>
    </linearGradient>

    <!-- Blue buildings gradient -->
    <linearGradient id="blueB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0e46c0"/>
      <stop offset="100%" stop-color="#2680d8"/>
    </linearGradient>

    <!-- Tall center building: bright white face -->
    <linearGradient id="tallB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#cce8f8"/>
      <stop offset="35%"  stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#9ac8e8"/>
    </linearGradient>

    <!-- Chevron gradient: white at peak → steel blue at tips -->
    <linearGradient id="chevG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#4a8ab8"/>
    </linearGradient>

    <!-- Right grid building -->
    <linearGradient id="gridB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#c4e0f4"/>
      <stop offset="100%" stop-color="#70a8c8"/>
    </linearGradient>

    <!-- "360" cyan text -->
    <linearGradient id="cyanTxt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#40dcff"/>
      <stop offset="100%" stop-color="#18b0e8"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.5)"/>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="appClip">
      <rect width="500" height="500" rx="80" ry="80"/>
    </clipPath>

  </defs>

  <!-- Drop shadow shape behind card -->
  <rect width="500" height="500" rx="80" ry="80" fill="rgba(0,0,0,0.35)" filter="url(#shadow)" transform="translate(0,8)"/>

  <!-- Background -->
  <rect width="500" height="500" rx="80" ry="80" fill="url(#bg)"/>
  <!-- Gloss highlight -->
  <rect width="500" height="500" rx="80" ry="80" fill="url(#gloss)"/>

  <g clip-path="url(#appClip)">

    <!-- ══ CIRCLE ARC ══
         Center (250,205) Radius 158
         Start  ~25° → (393, 272)
         End    ~315° → (362,  93)
         Sweep  290° clockwise  (large-arc=1)
         Gap ~70° at upper-right (1–3 o'clock)
    -->
    <path d="M 393,272
             A 158,158 0 1 1 362,93"
          fill="none"
          stroke="url(#arcG)"
          stroke-width="13"
          stroke-linecap="round"/>

    <!-- ══ BUILDINGS ══ -->

    <!-- Far-left flanker (small) -->
    <polygon points="172,272 176,232 194,232 190,272" fill="url(#blueB)"/>

    <!-- Left main blue building -->
    <polygon points="196,272 201,200 222,200 217,272" fill="url(#blueB)"/>

    <!-- CENTER TALL BUILDING (white hero, 3-D lean) -->
    <polygon points="226,272 232,112 260,112 255,272" fill="url(#tallB)"/>
    <!-- Right-face dark edge for 3-D depth -->
    <polygon points="255,272 260,112 264,115 259,272" fill="rgba(8,24,70,0.22)"/>

    <!-- Right main blue building -->
    <polygon points="262,272 267,182 287,182 283,272" fill="url(#blueB)"/>

    <!-- Far-right grid building -->
    <rect x="296" y="210" width="38" height="62" rx="2" fill="url(#gridB)"/>
    <!-- Floor lines -->
    <line x1="297" y1="219" x2="333" y2="219" stroke="#0b1d55" stroke-width="1.5" opacity="0.45"/>
    <line x1="297" y1="228" x2="333" y2="228" stroke="#0b1d55" stroke-width="1.5" opacity="0.45"/>
    <line x1="297" y1="237" x2="333" y2="237" stroke="#0b1d55" stroke-width="1.5" opacity="0.45"/>
    <line x1="297" y1="246" x2="333" y2="246" stroke="#0b1d55" stroke-width="1.5" opacity="0.45"/>
    <line x1="297" y1="255" x2="333" y2="255" stroke="#0b1d55" stroke-width="1.5" opacity="0.45"/>
    <line x1="297" y1="264" x2="333" y2="264" stroke="#0b1d55" stroke-width="1.5" opacity="0.45"/>
    <!-- Vertical divider -->
    <line x1="315" y1="210" x2="315" y2="272" stroke="#0b1d55" stroke-width="1.5" opacity="0.45"/>

    <!-- ══ CHEVRON / ROOFLINE ══
         Peak (250, 258)   Arms → (170, 305) and (330, 305)
    -->
    <polyline points="170,305 250,258 330,305"
              fill="none"
              stroke="url(#chevG)"
              stroke-width="17"
              stroke-linecap="round"
              stroke-linejoin="round"/>

    <!-- 2×2 window grid at chevron peak -->
    <rect x="241"   y="263" width="8" height="8" rx="1.5" fill="#30d8ff"/>
    <rect x="251.5" y="263" width="8" height="8" rx="1.5" fill="#30d8ff"/>
    <rect x="241"   y="273" width="8" height="8" rx="1.5" fill="#30d8ff"/>
    <rect x="251.5" y="273" width="8" height="8" rx="1.5" fill="#30d8ff"/>

    <!-- ══ TEXT ══ -->
    <text x="250" y="392"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
          font-size="52"
          font-weight="900"
          text-anchor="middle"
          letter-spacing="4">
      <tspan fill="white">REALTY </tspan><tspan fill="url(#cyanTxt)">360</tspan>
    </text>

  </g>
</svg>
